<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Painel</title>

    <link rel="stylesheet" href="css/inicio.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



</head>
<body>

    <button class="menu-mobile">

    <i class="fa-solid fa-bars"></i>

</button>


    <div class="layout">

    <aside class="sidebar">

    <div class="logo">

        <h2>Grupo de Conexões</h2>

    </div>

        <nav>

            <a href="PAGINA-INICIO.HTML" class="ativo">
                🏠 Início
            </a>

            <a href="novo-relatorio.html">
                📝 Novo Relatório
            </a>

            <a href="relatorios.html">
                📋 Relatórios
            </a>

            <a href="usuarios.html" id="menuUsuarios">
                👥 Usuários
            </a>

        </nav>

        <div class="sair">

            <a href="index.html">
                🚪 Sair
            </a>

        </div>

        

    </aside>

   <main class="content">

    <div class="topo">

        <div class="titulo">

            <h1>Bem-vindo 👋</h1>

            <p>Informações do Grupo de Conexões</p>

        </div>

    <div class="acoes-topo">

        <button id="tema-btn" class="tema-btn">
        <i class="fa-solid fa-moon"></i>
        </button>

        <button class="notificacao" id="btnNotificacao">
        <i class="fa-regular fa-bell"></i>
        <span class="badge" id="badgeNotificacao">0</span>
        </button>

        <div class="painel-notificacoes" id="painelNotificacoes">

        <h3>Notificações</h3>

        <div id="listaNotificacoes"></div>

        </div>

        </div>

        </div>

    <div class="cards">

    <div class="card azul">

        <div class="icone">
            <i class="fa-regular fa-file-lines"></i>
        </div>

        <div class="info">
            <p>Total de Relatórios</p>
            <h2 id="totalRelatorios">0</h2>
        </div>

    </div>

   

    <div class="card">

        <div class="icone roxo">
            <i class="fa-regular fa-calendar"></i>
        </div>

        <div class="info">
            <p>Relatórios este mês</p>
            <h2 id="relatoriosMes">0</h2>
        </div>

    </div>

    <div class="card">

        <div class="icone laranja">
            <i class="fa-regular fa-clock"></i>
        </div>

        <div class="info">
            <p>Pendentes</p>
            <h2 id="pendentes">0</h2>
        </div>

    </div>

</div>
    <section class="ultimos-relatorios">

    <h2>Últimos Relatórios</h2>

    <table>

        <thead>

            <tr>

                <th>Data</th>

                <th>Coordenador</th>

                <th>Status</th>

            </tr>

        </thead>

        <tbody id="listaInicio">

        </tbody>

    </table>

</section>

    </div>

</main>

</div>


    <nav class="mobile-nav">

    <a href="PAGINA-INICIO.HTML" class="mobile-item">
        <i class="fa-solid fa-house"></i>
        <span>Início</span>
    </a>

    <a href="relatorios.html" class="mobile-item">
        <i class="fa-regular fa-file-lines"></i>
        <span>Relatórios</span>
    </a>

    <a href="novo-relatorio.html" class="mobile-item">
        <i class="fa-solid fa-circle-plus"></i>
        <span>Novo</span>
    </a>

    <a href="usuarios.html" class="mobile-item" id="usuariosMobile">
        <i class="fa-solid fa-users"></i>
        <span>Usuários</span>
    </a>

    </nav>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="js/supabase.js"></script>

    <script src="js/PAGINA-INICIO.JS"></script>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script src="js/permissoes.js"></script>

    <script src="js/menu.js"></script>
    
</body>
</html>
